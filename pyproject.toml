[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipad-finder"
version = "1.0.0"
description = "Find en mistet iPad eller telefon ved at scanne Bluetooth-signaler."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["bleak>=1.0,<4"]

# Run from the source tree (python -m ipad_finder): the web app in web/ is
# served from next to the package and is not part of an installed wheel.
[tool.setuptools]
packages = ["ipad_finder"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
